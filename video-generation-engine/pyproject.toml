[project]
name = "video-generation-engine"
version = "0.1.0"
description = "AI-powered orchestration engine that transforms scripts into cinematic short-form videos."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/app", "backend/tests"]
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is black's job. B008: FastAPI's Depends()-as-default is
# the documented, idiomatic pattern, not a real mutable-default bug.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "(\\.venv|storage)"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["\\.venv", "storage", "tests/fixtures"]
